name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          install_args: node pnpm
      - run: pnpm install --frozen-lockfile
      # The demo resolves maude-wasm's types from its dist/, so build the
      # (pure-tsc) wrapper first.
      - run: pnpm --filter maude-wasm build
      - run: pnpm lint
      - run: pnpm knip
      - run: pnpm typecheck
